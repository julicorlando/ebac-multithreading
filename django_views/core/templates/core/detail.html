{% extends "core/base.html" %}

{% block title %}{{ post.title }} | Portfólio{% endblock %}

{% block content %}
<article class="card">
    <p><a href="{% url 'home' %}">← Voltar</a></p>
    <h2>{{ post.title }}</h2>
    <p class="muted">Publicado em {{ post.created_at|date:"d/m/Y H:i" }}</p>
    <div>{{ post.content|linebreaks }}</div>
</article>
{% endblock %}
