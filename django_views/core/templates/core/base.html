<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfólio | Júlio Orlando{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            background: #111827;
            color: #fff;
            padding: 22px 0;
        }
        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            gap: 28px;
            padding: 32px 0;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 18px;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .muted { color: var(--muted); }
        footer {
            border-top: 1px solid var(--border);
            padding: 22px 0;
            color: var(--muted);
            text-align: center;
        }
        @media (max-width: 760px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Portfólio de Júlio Orlando</h1>
            <p>Projeto em Django desenvolvido nos exercícios da EBAC.</p>
        </div>
    </header>

    <div class="container layout">
        <main>
            {% block content %}{% endblock %}
        </main>
        {% include "core/sidebar.html" %}
    </div>

    <footer>
        <div class="container">Django Templates • EBAC</div>
    </footer>
</body>
</html>
